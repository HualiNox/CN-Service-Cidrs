name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AGHOME_UPSTREAM_DNS: ${{ vars.AGHOME_UPSTREAM_DNS || 'https://dns.alidns.com/dns-query https://doh.pub/dns-query' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...
