name: Build and deploy Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "15 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build rules and website
        run: go run .

      - name: Compare generated rules with latest release
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          content_hash="$(jq -er '.content_hash' _site/metadata.json)"

          latest_tag="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')"
          previous_hash=""
          previous_source_metrics="[]"
          if [ -n "$latest_tag" ]; then
            mkdir -p "$RUNNER_TEMP/previous-release"
            if gh release download "$latest_tag" --pattern metadata.json --dir "$RUNNER_TEMP/previous-release" >/dev/null 2>&1; then
              previous_hash="$(jq -r '.content_hash // ""' "$RUNNER_TEMP/previous-release/metadata.json")"
              previous_metadata="$RUNNER_TEMP/previous-release/metadata.json"
              if jq -e '[.sources[] | has("rejected_cidr_count") and has("exclusive_ipv4_address_count") and has("exclusive_ipv6_address_count") and has("domain_count")] | all' "$previous_metadata" >/dev/null; then
                previous_source_metrics="$(jq -c '[.sources[] | {group, url, type, rejected_cidr_count: (.rejected_cidr_count // 0), exclusive_ipv4_address_count: (.exclusive_ipv4_address_count // "0"), exclusive_ipv6_address_count: (.exclusive_ipv6_address_count // "0"), domain_count: (.domain_count // 0)}] | sort_by(.group, .url, .type)' "$previous_metadata")"
              else
                previous_source_metrics="legacy"
              fi
            fi
          fi

          current_source_metrics="$(jq -c '[.sources[] | {group, url, type, rejected_cidr_count: (.rejected_cidr_count // 0), exclusive_ipv4_address_count: (.exclusive_ipv4_address_count // "0"), exclusive_ipv6_address_count: (.exclusive_ipv6_address_count // "0"), domain_count: (.domain_count // 0)}] | sort_by(.group, .url, .type)' _site/metadata.json)"

          python3 scripts/release_notes.py \
            "$RUNNER_TEMP/previous-release/metadata.json" \
            _site/metadata.json > "$RUNNER_TEMP/release-notes.md"

          if [ "$content_hash" = "$previous_hash" ] && [ "$current_source_metrics" = "$previous_source_metrics" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Generated CIDR files are unchanged."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Generated CIDR files changed."
          fi

      - name: Create rules archive
        if: steps.diff.outputs.changed == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/cn-service-cidrs/rules"
          cp -R output/tables/. "$RUNNER_TEMP/cn-service-cidrs/rules/"
          cd "$RUNNER_TEMP/cn-service-cidrs"
          zip -qr "$RUNNER_TEMP/rules.zip" rules
          mkdir -p "$RUNNER_TEMP/release-files"
          cp "$GITHUB_WORKSPACE/_site/metadata.json" "$RUNNER_TEMP/release-files/metadata.json"
          cp "$RUNNER_TEMP/rules.zip" "$RUNNER_TEMP/release-files/rules.zip"
          cp "$RUNNER_TEMP/release-notes.md" "$RUNNER_TEMP/release-files/release-notes.md"

      - name: Upload release files
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: ${{ runner.temp }}/release-files/
          if-no-files-found: error

      - name: Configure Pages
        if: github.event_name != 'schedule' || steps.diff.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'schedule' || steps.diff.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'schedule' || needs.build.outputs.changed == 'true'
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    runs-on: ubuntu-latest
    needs:
      - build
      - deploy
    if: needs.build.outputs.changed == 'true'
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release-files

      - name: Publish dated release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$(date -u +%F)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-files/metadata.json release-files/rules.zip --clobber
            gh release edit "$tag" --notes-file release-files/release-notes.md
          else
            gh release create "$tag" release-files/metadata.json release-files/rules.zip \
              --title "CN Service CIDRs $tag" \
              --notes-file release-files/release-notes.md
          fi
